[package]
name = "codex-usage-companion"
version = "0.1.0"
description = "A local-first floating usage companion for Codex"
authors = ["Codex Usage Companion contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "codex_usage_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
thiserror = "2"

